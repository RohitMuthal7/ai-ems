spring.application.name=ai-ems

# ============================================================
# DATABASE
# ============================================================

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# ============================================================
# JPA / HIBERNATE
# ============================================================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ============================================================
# EMAIL
# ============================================================

spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# SMTP timeout protection
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# ============================================================
# JWT
# ============================================================

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# ============================================================
# CALENDARIFIC
# ============================================================

calendarific.api.key=${CALENDARIFIC_API_KEY}
calendarific.base-url=${CALENDARIFIC_BASE_URL:https://calendarific.com/api/v2}

# ============================================================
# FILE UPLOAD
# ============================================================

file.upload-dir=${FILE_UPLOAD_DIR:/tmp/employee_uploads/profile}

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# ============================================================
# GOOGLE AI
# ============================================================

google.ai.api.key=${GOOGLE_AI_API_KEY}

# ============================================================
# CORS
# ============================================================

app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}

# ============================================================
# FRONTEND
# ============================================================

app.frontend.url=${APP_FRONTEND_URL:http://localhost:5173}

# ============================================================
# SERVER
# ============================================================

server.port=${PORT:10000}