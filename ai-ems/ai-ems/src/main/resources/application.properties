spring.application.name=ai-ems
server.port=${PORT:8080}

# ===============================
# DATABASE CONFIGURATION
# ===============================

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ai_ems}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# ===============================
# JPA / HIBERNATE
# ===============================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:false}

# ===============================
# EMAIL CONFIGURATION
# ===============================

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ===============================
# JWT CONFIGURATION
# ===============================

jwt.secret=${JWT_SECRET:}
jwt.expiration=${JWT_EXPIRATION:86400000}

# ===============================
# CALENDARIFIC CONFIGURATION
# ===============================

calendarific.api.key=${CALENDARIFIC_API_KEY:}
calendarific.base-url=${CALENDARIFIC_BASE_URL:https://calendarific.com/api/v2}

# ===============================
# FILE UPLOAD CONFIGURATION
# ===============================

file.upload-dir=${FILE_UPLOAD_DIR:./uploads/profile}

# ===============================
# MULTIPART CONFIGURATION
# ===============================

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# ===============================
# GOOGLE GEMINI CONFIGURATION
# ===============================

google.ai.api.key=${GOOGLE_AI_API_KEY:}

# ===============================
# CORS CONFIGURATION
# ===============================

app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
app.frontend.url=https://vermillion-duckanoo-7f3b1a.netlify.app